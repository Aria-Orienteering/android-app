# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE are ignored when building from the
# command line, check build.gradle for more details.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html
# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for headless machines. See also
# http://gradle.org/docs/current/userguide/gradle_daemon.html
# For example, you might specify the following additional JVM arguments:
# org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
# org.gradle.parallel=true
# AndroidX package structure to make it clearer which packages are being used in your project.
# Enables namespacing of each library's R class so that its R class includes only the
# resources declared in the library itself and does its dependencies' R classes.
# You can enable or disable this setting per-library here shown an example
# of enabling on a per library basis:
# android.disableResourceValidation=true
# Set this to true to enable the non-deprecated AndroidX classes
android.useAndroidX=true
android.enableJetifier=true

# Gradle performance optimizations
org.gradle.jvmargs=-Xmx2048m
org.gradle.parallel=true
org.gradle.caching=true
