apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

//*************************************//
// Add definitions here
// Security improvement: Load from local.properties instead of gradle.properties
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream ->
        localProperties.load(stream)
    }
}

def FIREBASE_WEB_CLIENT_KEY = localProperties.getProperty('FirebaseWebClientKey') ?: '""'
def FIREBASE_WEB_CLIENT_SECRET = localProperties.getProperty('FirebaseWebClientSecretKey') ?: '""'
def GOOGLE_MAP_API_KEY = localProperties.getProperty('GoogleMapApiKey') ?: '""'

def STRING = 'String'
//************************************//

android {
    namespace 'com.lxdnz.nz.ariaorienteering'
    compileSdk 35

    defaultConfig {
        applicationId "com.lxdnz.nz.ariaorienteering"
        minSdkVersion 24
        targetSdkVersion 35
        versionCode 2
        versionName "2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        //****DEFINE THE VARIABLES HERE****//
        buildConfigField STRING, 'FirebaseWebClientKey', "\"${FIREBASE_WEB_CLIENT_KEY}\""
        buildConfigField STRING, 'FirebaseWebClientSecretKey', "\"${FIREBASE_WEB_CLIENT_SECRET}\""
        buildConfigField STRING, 'GoogleMapApiKey', "\"${GOOGLE_MAP_API_KEY}\""

        // Inject Google Maps API Key as string resource for AndroidManifest.xml
        resValue "string", "google_map_api_key", "${GOOGLE_MAP_API_KEY}"
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    // Kotlin
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"

    // AndroidX Core Libraries
    implementation 'androidx.core:core-ktx:1.15.0'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.fragment:fragment-ktx:1.8.5'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'

    // Material Design
    implementation 'com.google.android.material:material:1.12.0'

    // Lifecycle Components (ViewModel, LiveData)
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.8.7'

    // Kotlin Coroutines (replaces Kovenant)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-play-services:1.9.0'

    // Firebase BoM (Bill of Materials) - ensures compatible versions
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-database-ktx'
    implementation 'com.google.firebase:firebase-auth-ktx'

    // Google Play Services
    implementation 'com.google.android.gms:play-services-auth:21.2.0'
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.maps.android:android-maps-utils:3.8.2'

    // WorkManager for background tasks
    implementation 'androidx.work:work-runtime-ktx:2.10.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.9.0'
    testImplementation 'androidx.arch.core:core-testing:2.2.0'
    testImplementation 'io.mockk:mockk:1.13.13'

    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
}

apply plugin: 'com.google.gms.google-services'
